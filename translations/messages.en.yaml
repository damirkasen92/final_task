custom_id:
    title: Custom id
    description: You can set up items with inventory numbers in your preferred format.
        To create a format, add new elements, edit them, drag to reorder, or drag elements out of the form to delete them.
    random: "D - decimal\nX - hexadecimal\nO - octal\nB - binary.\nUse numbers from 1 to 20.\nFor example: D6 outputs 999999.\nIt is acceptable to put a separator at the end - or _ for example: D6_"
    static:
        The text will be static.
    uuid: |
        A unique id will be generated.
        Separators are possible at the end - or _ for example: unique_id-
    date: |
        dd - day
        ddd - day of the week
        mm - month
        yyyy - year
        It is mandatory to use - or _ between abbreviations.
        Separators are possible at the end - or _ for example: date_
    seq: |
        The current + 1 index for item will be used.
        Separators are possible at the end - or _ for example: seq-


