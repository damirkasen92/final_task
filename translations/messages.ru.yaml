custom_id:
    title: 'Пользовательский ID'
    description: 'Вы можете настроить элементы с номерами инвентаря в предпочитаемом формате.
        Чтобы создать формат, добавьте новые элементы, редактируйте их, перетаскивайте для изменения порядка или удаляйте, перетаскивая их за пределы формы.'
    random: "D - десятичный\nX - шестнадцатеричный\nO - восьмеричный\nB - двоичный.\nИспользуйте числа от 1 до 20.\nНапример: D6 выдаёт 999999.\nДопустимо поставить разделитель в конце - или _, например: D6_"
    static:
        'Текст будет статичным.'
    uuid: |
        Будет сгенерирован уникальный ID.
        Разделители возможны в конце - или _, например: unique_id-
    date: |
        dd - день
        ddd - день недели
        mm - месяц
        yyyy - год
        Обязательно использовать - или _ между сокращениями.
        Разделители возможны в конце - или _, например: date_
    seq: |
        Будет использован текущий индекс элемента + 1.
        Разделители возможны в конце - или _, например: seq-
    add_element: 'Добавить элемент'
    check: 'Формат пользовательского ID недействителен'

    validation:
        fixed: 'Фиксированное значение не может быть пустым'
        suffix: 'Допустимые значения только - или _ для %type%'
        date: 'Неверный формат даты: %value% для %type%'
        rand:
            format: 'Неверный формат: %value% для %type%'
            number: 'Число слишком большое: %number% для %type%'

